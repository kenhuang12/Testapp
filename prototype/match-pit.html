<title>Match Pit — Playable Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  :root{
    --bg:#120e1a; --stone:#2a2338; --bone:#efe6d8; --ember:#ff7a3c;
    --magma:#ff4d6d; --dim:#8f8499;
  }
  html,body{margin:0;padding:0;height:100%;background:var(--bg);overflow:hidden;
    font-family:"Arial Narrow","Avenir Next Condensed","Helvetica Neue",Arial,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none}
  #c{position:fixed;inset:0;display:block;touch-action:none}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;color:var(--bone);gap:14px;padding:24px;
    background:radial-gradient(ellipse at 50% 40%, rgba(18,14,26,.55), rgba(18,14,26,.93));
    transition:opacity .22s ease;z-index:5}
  .overlay.hidden{opacity:0;pointer-events:none}
  .eyebrow{font-size:13px;letter-spacing:.34em;color:var(--ember);text-transform:uppercase}
  h1{margin:0;font-size:clamp(48px,13vw,84px);line-height:.95;letter-spacing:.02em;
    text-transform:uppercase;font-weight:700;text-wrap:balance}
  .rules{max-width:32ch;font-size:17px;line-height:1.5;color:var(--dim)}
  .rules b{color:var(--bone);font-weight:700}
  .cta{margin-top:8px;font-size:15px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--ember);animation:pulse 1.6s ease-in-out infinite}
  .big{font-size:clamp(38px,10vw,64px);font-weight:700;color:var(--magma);
    text-transform:uppercase;letter-spacing:.03em;margin:0}
  .score-line{font-size:20px;letter-spacing:.12em}
  .score-line span{color:var(--ember);font-variant-numeric:tabular-nums}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  @media (prefers-reduced-motion: reduce){.cta{animation:none}}

  /* level-up cards */
  #levelup .cards{display:flex;flex-direction:column;gap:12px;width:min(88vw,340px)}
  .card{background:#1c1729;border:1px solid #3b3150;border-left:5px solid var(--ember);
    color:var(--bone);text-align:left;padding:14px 16px;font:inherit;cursor:pointer;
    border-radius:4px}
  .card:active{transform:scale(.985)}
  .card .cname{font-size:19px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .card .cdesc{font-size:14px;color:var(--dim);line-height:1.4;margin-top:4px}
  .card.fuse{border-left-color:#f6f2ff;background:#241d38}
  .card.fuse .cname{color:#f6f2ff}
  .card:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
</style>

<canvas id="c"></canvas>

<div id="title" class="overlay">
  <div class="eyebrow">Playable Prototype Nº2</div>
  <h1>Match&nbsp;Pit</h1>
  <div class="rules">Monsters descend the columns. <b>Swap gems to match 3</b> —
    matches fire up their own column. Level up, <b>fuse two gem types into one</b>,
    and hold the line. Three breaches and the pit wins.</div>
  <div class="cta">Tap to fight</div>
</div>

<div id="levelup" class="overlay hidden">
  <div class="eyebrow">Level Up</div>
  <div class="cards" id="cardbox"></div>
</div>

<div id="over" class="overlay hidden">
  <div class="eyebrow">Run Over</div>
  <p class="big">The pit wins</p>
  <div class="score-line">Score <span id="fscore">0</span> &nbsp;·&nbsp; Best <span id="fbest">0</span></div>
  <div class="score-line" style="font-size:15px;color:var(--dim)" id="fwave"></div>
  <div class="cta">Tap to retry</div>
</div>

<script>
(() => {
'use strict';
{ // force mobile viewport even if host head lacks one
  let m=document.querySelector('meta[name="viewport"]');
  if(!m){ m=document.createElement('meta'); m.name='viewport'; document.head.appendChild(m); }
  m.content='width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover';
}
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const $t=document.getElementById('title'), $o=document.getElementById('over'),
      $lv=document.getElementById('levelup'), $cards=document.getElementById('cardbox');
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd=(a,b)=>a+Math.random()*(b-a);

// ---------- layout ----------
const CO=7, RO=6; // board columns x rows
let W,H,DPR,cell,boardX,boardTop,fieldTop;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2.5);
  const vv=window.visualViewport;
  W=Math.round(vv?vv.width:innerWidth); H=Math.round(vv?vv.height:innerHeight);
  cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px';
  cell=Math.min((W-14)/CO, (H*0.42)/RO, 64);
  boardX=(W-cell*CO)/2;
  boardTop=H-cell*RO-10;
  fieldTop=64;
}
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,250));
if(window.visualViewport) visualViewport.addEventListener('resize',resize);
resize(); setTimeout(resize,100);

const gx=c=>boardX+cell*(c+0.5), gy=r=>boardTop+cell*(r+0.5);
const laneX=c=>gx(c);

// ---------- colors / build ----------
const BASE={
  fire :{name:'FIRE',  hex:'#ff6b4a', dk:'#b23a24', base:13, shape:'diamond', props:{}},
  frost:{name:'FROST', hex:'#58c7ff', dk:'#2b7fb0', base:8,  shape:'circle',  props:{slow:2}},
  volt :{name:'VOLT',  hex:'#ffd23f', dk:'#b28e14', base:7,  shape:'triangle',props:{chain:2}},
  venom:{name:'VENOM', hex:'#5ce8a4', dk:'#2a9c66', base:6,  shape:'square',  props:{poison:4}},
};
const FUSE={
  'fire+frost':{name:'STEAM',  hex:'#cfe8ff', dk:'#7fa8c9'},
  'fire+volt' :{name:'PLASMA', hex:'#ffb14a', dk:'#c07c1e', extra:{pierce:1}},
  'fire+venom':{name:'NAPALM', hex:'#ff8a3c', dk:'#c05a18', extra:{splash:1}},
  'frost+volt':{name:'STATIC', hex:'#a9d9ff', dk:'#6f9cc4'},
  'frost+venom':{name:'CRYOTOX',hex:'#7fe8d0', dk:'#3fa892'},
  'venom+volt':{name:'PLAGUE ARC',hex:'#c9f04d', dk:'#8aa826'},
};
let colors={}, lvl={}, surge=0, chill=0; // active color defs, per-color level, global stacks

function activeList(){ return Object.keys(colors); }
function makeFusion(a,b){
  const key=[a,b].sort().join('+'), f=FUSE[key]; if(!f) return null;
  const A=colors[a], B=colors[b];
  const props=Object.assign({},A.props,B.props,f.extra||{});
  return {name:f.name, hex:f.hex, dk:f.dk, base:(A.base+B.base)*1.7, shape:'hex', props, fused:true};
}

// ---------- state ----------
let state='title', grid=[], busy=false, swapping=null, resolveT=0, combo=0;
let mons=[], projs=[], parts=[], floats=[], zaps=[];
let score=0,best=0,hearts=3,wave=1,level=1,xp=0,xpNeed=25,tGame=0,tReal=0;
let spawnT=1.5,nextBoss=45,shake=0,hurtFlash=0,paused=false,overAt=0;
try{ best=+localStorage.getItem('matchpit_best')||0; }catch(e){}
const specks=[]; for(let i=0;i<60;i++) specks.push([Math.random(),Math.random(),Math.random()]);

// ---------- audio ----------
let AC=null,master=null;
function initAudio(){ if(AC){AC.resume&&AC.resume();return;}
  try{ AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=0.2; master.connect(AC.destination);}catch(e){} }
function beep(f,dur,type,vol,slide){ if(!AC)return;
  const o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime;
  o.type=type||'triangle'; o.frequency.setValueAtTime(f,t0);
  if(slide)o.frequency.linearRampToValueAtTime(Math.max(30,f+slide),t0+dur);
  g.gain.setValueAtTime((vol||1)*0.5,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+0.02); }
const PENTA=[392,440,523,587,659,784,880,1047];
const sPop=c=>{beep(PENTA[Math.min(c,7)],0.14,'triangle',0.9);};
const sSwap=()=>beep(220,0.05,'sine',0.3);
const sBad=()=>beep(120,0.09,'sine',0.4,-40);
const sKill=()=>{beep(560,0.12,'square',0.4,-260);beep(85,0.1,'sine',0.7);};
const sHurt=()=>beep(150,0.3,'sawtooth',0.8,-70);
const sLvl=()=>{beep(523,0.12,'triangle',0.8);setTimeout(()=>beep(784,0.2,'triangle',0.8),110);};
const sFuse=()=>{beep(392,0.15,'triangle',0.9);setTimeout(()=>beep(587,0.15,'triangle',0.9),130);
  setTimeout(()=>beep(880,0.3,'triangle',1),260);};
const sBoss=()=>beep(55,0.6,'sawtooth',0.9,12);

// ---------- fx helpers ----------
function puff(x,y,n,col,pow){ for(let i=0;i<n;i++){ const a=Math.random()*6.283,s=rnd(40,pow||170);
  parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,r:rnd(2,5),life:rnd(.3,.7),max:.7,col}); } }
function float(x,y,txt,col,size){ floats.push({x,y,txt,col,size:size||14,life:1}); }
function addShake(v){ shake+=v*(reduceMotion?0.25:1); }

// ---------- board ----------
function newGem(cn,c,r,above){ return {cn,px:gx(c),py:above!=null?above:gy(r)}; }
function randColor(){ const a=activeList(); return a[Math.floor(Math.random()*a.length)]; }
function fillBoard(){
  grid=[]; for(let r=0;r<RO;r++){ grid.push([]); for(let c=0;c<CO;c++) grid[r].push(newGem(randColor(),c,r)); }
  // clear initial matches by rerolling
  let guard=0;
  while(findRuns().length&&guard++<200){
    for(const run of findRuns()) for(const [r,c] of run.cells) grid[r][c].cn=randColor();
  }
  if(!movesExist()) shuffleBoard();
}
function findRuns(){
  const runs=[];
  for(let r=0;r<RO;r++){ let c=0; while(c<CO){ let c2=c; const cn=grid[r][c]&&grid[r][c].cn;
    while(cn&&c2<CO&&grid[r][c2]&&grid[r][c2].cn===cn)c2++;
    if(cn&&c2-c>=3){ const cells=[]; for(let k=c;k<c2;k++)cells.push([r,k]); runs.push({cn,cells,len:c2-c}); }
    c=Math.max(c2,c+1); } }
  for(let c=0;c<CO;c++){ let r=0; while(r<RO){ let r2=r; const cn=grid[r][c]&&grid[r][c].cn;
    while(cn&&r2<RO&&grid[r2][c]&&grid[r2][c].cn===cn)r2++;
    if(cn&&r2-r>=3){ const cells=[]; for(let k=r;k<r2;k++)cells.push([k,c]); runs.push({cn,cells,len:r2-r}); }
    r=Math.max(r2,r+1); } }
  return runs;
}
function movesExist(){
  const trySwap=(r1,c1,r2,c2)=>{ const a=grid[r1][c1],b=grid[r2][c2];
    grid[r1][c1]=b;grid[r2][c2]=a; const ok=findRuns().length>0; grid[r1][c1]=a;grid[r2][c2]=b; return ok; };
  for(let r=0;r<RO;r++)for(let c=0;c<CO;c++){
    if(c+1<CO&&trySwap(r,c,r,c+1))return true;
    if(r+1<RO&&trySwap(r,c,r+1,c))return true; }
  return false;
}
function shuffleBoard(){
  const all=[]; for(let r=0;r<RO;r++)for(let c=0;c<CO;c++)all.push(grid[r][c].cn);
  let guard=0;
  do{ for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]];}
      let k=0; for(let r=0;r<RO;r++)for(let c=0;c<CO;c++)grid[r][c].cn=all[k++];
  }while((findRuns().length||!movesExist())&&guard++<300);
  float(W/2,boardTop-20,'RESHUFFLE','#8f8499',16);
}
function settleStep(dt){ // move gems toward targets; return true if all settled
  let done=true; const sp=cell*16*dt;
  for(let r=0;r<RO;r++)for(let c=0;c<CO;c++){ const g=grid[r][c]; if(!g)continue;
    const tx=gx(c),ty=gy(r);
    const dx=tx-g.px,dy=ty-g.py,d=Math.hypot(dx,dy);
    if(d>1){ done=false; const m=Math.min(d,sp); g.px+=dx/d*m; g.py+=dy/d*m; } else {g.px=tx;g.py=ty;} }
  return done;
}
function popRuns(runs){
  combo++;
  const mult=(1+0.25*(combo-1));
  for(const run of runs){
    const lenB=run.len>=5?2.6:run.len===4?1.8:1;
    for(let i=0;i<run.cells.length;i++){
      const [r,c]=run.cells[i], g=grid[r][c]; if(!g)continue;
      const col=colors[run.cn];
      const dmg=col.base*(1+0.5*((lvl[run.cn]||1)-1))*(1+0.25*surge)*lenB*mult;
      projs.push({lane:c,x:gx(c),y:g.py,vy:-(H*1.1),cn:run.cn,dmg,delay:i*0.045});
      puff(g.px,g.py,6,col.hex,120);
      grid[r][c]=null;
      score+=Math.round(2*lenB*mult);
    }
  }
  sPop(Math.min(combo-1,7));
  if(combo>=2) float(W/2, boardTop-26, 'CHAIN ×'+combo, '#ff7a3c', 20);
}
function gravity(){
  for(let c=0;c<CO;c++){
    const stack=[]; for(let r=RO-1;r>=0;r--) if(grid[r][c]) stack.push(grid[r][c]);
    let r=RO-1;
    for(const g of stack){ grid[r][c]=g; r--; }
    let above=1;
    for(;r>=0;r--){ grid[r][c]=newGem(randColor(),c,r, boardTop-cell*(above++)+cell*0.5-cell); }
  }
}
function transmute(a,b,toCn){
  for(let r=0;r<RO;r++)for(let c=0;c<CO;c++){ const g=grid[r][c];
    if(g&&(g.cn===a||g.cn===b)){ g.cn=toCn; puff(g.px,g.py,4,colors[toCn].hex,90); } }
  busy=true; resolveT=0.25; // let the transmute cascade
}

// ---------- combat ----------
function spawnMon(boss){
  const lane=Math.floor(Math.random()*(boss?CO-1:CO));
  const hp=boss?140+wave*40:10+wave*6;
  mons.push({lane,wid:boss?2:1,y:fieldTop,hp,maxhp:hp,boss:!!boss,
    spd:(boss?9:15+wave*1.8),slow:0,poison:null,ph:Math.random()*7,dead:false});
  if(boss){ addShake(14); sBoss(); float(W/2,fieldTop+40,'BOSS','#ff4d6d',26); }
}
function monX(m){ return m.wid===2?(laneX(m.lane)+laneX(m.lane+1))/2:laneX(m.lane); }
function monR(m){ return (m.boss?0.85:0.36)*cell; }
function inLane(m,lane){ return lane>=m.lane&&lane<m.lane+m.wid; }
function hitMon(m,dmg,cn){
  m.hp-=dmg; float(monX(m),m.y-monR(m)-6,'-'+Math.round(dmg),colors[cn]?colors[cn].hex:'#ffd23f',13);
  const P=colors[cn]?colors[cn].props:{};
  if(P.slow) m.slow=Math.max(m.slow,P.slow);
  if(P.poison) m.poison={dps:P.poison*(1+0.25*surge),t:3};
  if(m.hp<=0&&!m.dead){ m.dead=true;
    const pts=30+8*wave+(m.boss?300:0); score+=pts; xp+=(m.boss?20:4+wave);
    float(monX(m),m.y,'+'+pts,'#5ce8a4',m.boss?22:14);
    puff(monX(m),m.y,m.boss?30:10,'#cfc3ad'); sKill(); if(m.boss)addShake(10); }
}
function applyHit(p,m){
  hitMon(m,p.dmg,p.cn);
  const P=colors[p.cn]?colors[p.cn].props:{};
  if(P.chain){ const others=mons.filter(o=>!o.dead&&o!==m)
      .sort((a,b)=>Math.hypot(monX(a)-monX(m),a.y-m.y)-Math.hypot(monX(b)-monX(m),b.y-m.y))
      .slice(0,P.chain);
    for(const o of others){ hitMon(o,p.dmg*0.6,p.cn);
      zaps.push({x1:monX(m),y1:m.y,x2:monX(o),y2:o.y,life:0.18}); } }
  if(P.splash){ for(const o of mons){ if(!o.dead&&o!==m&&Math.abs(o.lane-m.lane)<=1&&Math.abs(o.y-m.y)<cell*2)
      hitMon(o,p.dmg*0.6,p.cn); } }
  puff(p.x,m.y,8,colors[p.cn].hex,140);
}

// ---------- input ----------
let drag=null;
function cellAt(x,y){
  const c=Math.floor((x-boardX)/cell), r=Math.floor((y-boardTop)/cell);
  return (c>=0&&c<CO&&r>=0&&r<RO)?[r,c]:null;
}
addEventListener('pointerdown',e=>{
  initAudio();
  if(state==='title'){ startGame(); return; }
  if(state==='over'){ if(tReal-overAt>0.6) startGame(); return; }
  if(paused||busy||!e.isPrimary) return;
  const cl=cellAt(e.clientX,e.clientY); if(cl) drag={r:cl[0],c:cl[1],x:e.clientX,y:e.clientY};
});
addEventListener('pointermove',e=>{
  if(!drag||busy||paused||!e.isPrimary) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(Math.hypot(dx,dy)<cell*0.35) return;
  let r2=drag.r,c2=drag.c;
  if(Math.abs(dx)>Math.abs(dy)) c2+=dx>0?1:-1; else r2+=dy>0?1:-1;
  if(r2<0||r2>=RO||c2<0||c2>=CO){ drag=null; return; }
  doSwap(drag.r,drag.c,r2,c2); drag=null;
});
addEventListener('pointerup',()=>{ drag=null; });

function doSwap(r1,c1,r2,c2){
  const a=grid[r1][c1],b=grid[r2][c2];
  grid[r1][c1]=b; grid[r2][c2]=a;
  const ok=findRuns().length>0;
  busy=true; swapping={r1,c1,r2,c2,ok,phase:0}; sSwap();
  if(!ok){ /* will revert after gems arrive */ }
}

// ---------- level ups ----------
function offerCards(){
  paused=true; $cards.innerHTML='';
  const opts=[];
  const act=activeList();
  // fusion offers first — they're the point
  for(let i=0;i<act.length;i++)for(let j=i+1;j<act.length;j++){
    const a=act[i],b=act[j];
    if((lvl[a]||1)>=3&&(lvl[b]||1)>=3&&!colors[a].fused&&!colors[b].fused){
      const f=makeFusion(a,b); if(f) opts.push({t:'fuse',a,b,f});
    } }
  for(const c of act) if((lvl[c]||1)<3&&!colors[c].fused)
    opts.push({t:'up',c});
  if(hearts<3) opts.push({t:'heal'});
  if(surge<4) opts.push({t:'surge'});
  if(chill<3) opts.push({t:'chill'});
  // pick 3: keep at most 1 fusion, then shuffle rest
  const fuses=opts.filter(o=>o.t==='fuse'), rest=opts.filter(o=>o.t!=='fuse');
  for(let i=rest.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[rest[i],rest[j]]=[rest[j],rest[i]];}
  const picks=(fuses.length?[fuses[Math.floor(Math.random()*fuses.length)]]:[]).concat(rest).slice(0,3);
  if(!picks.length){ score+=100; float(W/2,H/2,'+100','#5ce8a4',20); paused=false; return; }
  for(const o of picks){
    const btn=document.createElement('button'); btn.className='card'+(o.t==='fuse'?' fuse':'');
    let nm='',ds='';
    if(o.t==='up'){ const L=(lvl[o.c]||1)+1; nm=colors[o.c].name+' '+['','I','II','III'][L];
      ds=colors[o.c].name.toLowerCase()+' matches deal +50% damage.';
      btn.style.borderLeftColor=colors[o.c].hex; }
    if(o.t==='fuse'){ nm='FUSE → '+o.f.name;
      ds=colors[o.a].name+' + '+colors[o.b].name+' become one gem. Fewer colors, easier matches, both powers in every shot.'; }
    if(o.t==='heal'){ nm='MEND'; ds='Restore one heart.'; btn.style.borderLeftColor='#ff4d6d'; }
    if(o.t==='surge'){ nm='SURGE'; ds='All damage +25%.'; }
    if(o.t==='chill'){ nm='DREAD'; ds='All monsters descend 12% slower.'; btn.style.borderLeftColor='#58c7ff'; }
    btn.innerHTML='<div class="cname">'+nm+'</div><div class="cdesc">'+ds+'</div>';
    btn.onclick=()=>{ applyCard(o); $lv.classList.add('hidden'); paused=false; };
    $cards.appendChild(btn);
  }
  $lv.classList.remove('hidden'); sLvl();
}
function applyCard(o){
  if(o.t==='up') lvl[o.c]=(lvl[o.c]||1)+1;
  if(o.t==='heal') hearts=Math.min(3,hearts+1);
  if(o.t==='surge') surge++;
  if(o.t==='chill') chill++;
  if(o.t==='fuse'){
    const key=o.f.name.toLowerCase().replace(/\s/g,'');
    delete colors[o.a]; delete colors[o.b]; delete lvl[o.a]; delete lvl[o.b];
    colors[key]=o.f; lvl[key]=3;
    transmute(o.a,o.b,key); sFuse(); addShake(8);
    float(W/2,boardTop-40,o.f.name+'!',o.f.hex,26);
  }
}

// ---------- flow ----------
function startGame(){
  colors={fire:Object.assign({},BASE.fire),frost:Object.assign({},BASE.frost),
          volt:Object.assign({},BASE.volt),venom:Object.assign({},BASE.venom)};
  lvl={fire:1,frost:1,volt:1,venom:1}; surge=0; chill=0;
  mons=[];projs=[];parts=[];floats=[];zaps=[];
  score=0;hearts=3;wave=1;level=1;xp=0;xpNeed=25;tGame=0;spawnT=1.2;nextBoss=45;
  combo=0;busy=false;swapping=null;paused=false;shake=0;hurtFlash=0;
  fillBoard();
  state='play'; $t.classList.add('hidden'); $o.classList.add('hidden'); $lv.classList.add('hidden');
}
function endGame(){
  state='over'; overAt=tReal; paused=false; $lv.classList.add('hidden');
  if(score>best){best=score;try{localStorage.setItem('matchpit_best',best);}catch(e){}}
  document.getElementById('fscore').textContent=score;
  document.getElementById('fbest').textContent=best;
  document.getElementById('fwave').textContent='SURVIVED TO WAVE '+wave;
  $o.classList.remove('hidden');
}
function breach(m){
  hearts-= m.boss?2:1; hurtFlash=1; addShake(10); sHurt();
  float(monX(m),boardTop-14,'BREACH','#ff4d6d',20);
  if(hearts<=0){ hearts=0; endGame(); }
}

// ---------- update ----------
function update(dt){
  tGame+=dt;
  wave=1+Math.floor(tGame/16);
  spawnT-=dt;
  if(spawnT<=0){ spawnMon(false); spawnT=Math.max(0.7,2.6-0.14*wave); }
  if(tGame>=nextBoss){ spawnMon(true); nextBoss+=45; }
  if(xp>=xpNeed){ xp-=xpNeed; level++; xpNeed=Math.round(xpNeed*1.35); offerCards(); }

  // board state machine
  if(busy){
    if(swapping){
      if(settleStep(dt)){
        if(swapping.ok){ swapping=null; resolveT=0.05; }
        else if(swapping.phase===0){ // revert
          const s=swapping; const a=grid[s.r1][s.c1],b=grid[s.r2][s.c2];
          grid[s.r1][s.c1]=b; grid[s.r2][s.c2]=a; s.phase=1; sBad();
        } else { swapping=null; busy=false; combo=0; }
      }
    } else {
      const settled=settleStep(dt);
      if(settled){
        resolveT-=dt;
        if(resolveT<=0){
          const runs=findRuns();
          if(runs.length){ popRuns(runs); gravity(); resolveT=0.12; }
          else { busy=false; combo=0; if(!movesExist()) shuffleBoard(); }
        }
      }
    }
  } else if(swappingCheckIdleMatches()){ /* safety: cascade after transmute */ }

  // projectiles
  for(const p of projs){
    if(p.delay>0){ p.delay-=dt; continue; }
    p.y+=p.vy*dt;
    let hit=null;
    for(const m of mons){ if(!m.dead&&inLane(m,p.lane)&&Math.abs(m.y-p.y)<monR(m)+8&&p.y>fieldTop-20){
      if(!hit||m.y>hit.y) hit=m; } }
    if(hit){ applyHit(p,hit);
      const P=colors[p.cn]?colors[p.cn].props:{};
      if(!P.pierce) p.dead=true; }
    if(p.y<fieldTop-30) p.dead=true;
  }
  projs=projs.filter(p=>!p.dead);

  // monsters
  for(const m of mons){
    m.ph+=dt*2;
    let sp=m.spd*(1-0.12*chill); if(m.slow>0){ sp*=0.5; m.slow-=dt; }
    m.y+=sp*dt*(cell/60);
    if(m.poison){ m.poison.t-=dt; hitMonSilent(m,m.poison.dps*dt); if(m.poison.t<=0)m.poison=null; }
    if(!m.dead&&m.y+monR(m)>=boardTop-2){ m.dead=true; puff(monX(m),m.y,12,'#cfc3ad'); breach(m); }
  }
  mons=mons.filter(m=>!m.dead);

  for(const p of parts){ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=500*dt; }
  parts=parts.filter(p=>p.life>0);
  for(const f of floats){ f.life-=dt*0.85; f.y-=30*dt; }
  floats=floats.filter(f=>f.life>0);
  for(const z of zaps) z.life-=dt;
  zaps=zaps.filter(z=>z.life>0);
}
function hitMonSilent(m,dmg){ m.hp-=dmg;
  if(m.hp<=0&&!m.dead){ m.dead=true; const pts=30+8*wave; score+=pts; xp+=4+wave;
    float(monX(m),m.y,'+'+pts,'#5ce8a4',14); puff(monX(m),m.y,10,'#cfc3ad'); sKill(); } }
function swappingCheckIdleMatches(){
  const runs=findRuns();
  if(runs.length){ busy=true; resolveT=0.05; return true; }
  return false;
}

// ---------- draw ----------
function drawShape(x,y,r,shape,fill,dark){
  ctx.fillStyle=dark; shapePath(x,y+1.5,r,shape); ctx.fill();
  ctx.fillStyle=fill; shapePath(x,y,r*0.94,shape); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.3)';
  ctx.beginPath(); ctx.arc(x-r*0.3,y-r*0.33,r*0.18,0,7); ctx.fill();
}
function shapePath(x,y,r,s){
  ctx.beginPath();
  if(s==='circle') ctx.arc(x,y,r,0,7);
  else if(s==='diamond'){ ctx.moveTo(x,y-r);ctx.lineTo(x+r,y);ctx.lineTo(x,y+r);ctx.lineTo(x-r,y); }
  else if(s==='triangle'){ ctx.moveTo(x,y-r);ctx.lineTo(x+r*0.9,y+r*0.7);ctx.lineTo(x-r*0.9,y+r*0.7); }
  else if(s==='square'){ const k=r*0.82; ctx.rect(x-k,y-k,2*k,2*k); }
  else { for(let i=0;i<6;i++){ const a=Math.PI/6+i*Math.PI/3;
      const px=x+Math.cos(a)*r, py=y+Math.sin(a)*r; i?ctx.lineTo(px,py):ctx.moveTo(px,py); } }
  ctx.closePath();
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(shake>0.1){ ctx.translate(rnd(-shake,shake),rnd(-shake,shake)); shake*=0.86; } else shake=0;

  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#171226'); g.addColorStop(1,'#0c0913');
  ctx.fillStyle=g; ctx.fillRect(-20,-20,W+40,H+40);
  ctx.fillStyle='rgba(239,230,216,0.05)';
  for(const s of specks) ctx.fillRect(s[0]*W,s[1]*(boardTop-20),2*s[2]+1,2*s[2]+1);

  // lanes
  ctx.strokeStyle='rgba(239,230,216,0.05)'; ctx.lineWidth=1;
  for(let c=0;c<=CO;c++){ const x=boardX+c*cell;
    ctx.beginPath(); ctx.moveTo(x,fieldTop-10); ctx.lineTo(x,boardTop); ctx.stroke(); }

  // board frame = breach line
  ctx.fillStyle='#2a2338'; ctx.fillRect(boardX-6,boardTop-6,cell*CO+12,cell*RO+12);
  ctx.fillStyle='#1c1729'; ctx.fillRect(boardX,boardTop,cell*CO,cell*RO);
  ctx.strokeStyle='rgba(255,122,60,0.7)'; ctx.lineWidth=2; ctx.setLineDash([8,7]);
  ctx.beginPath(); ctx.moveTo(boardX-6,boardTop-8); ctx.lineTo(boardX+cell*CO+6,boardTop-8); ctx.stroke();
  ctx.setLineDash([]);

  // gems (clip to board so refills don't draw over field)
  ctx.save(); ctx.beginPath(); ctx.rect(boardX,boardTop-cell,cell*CO,cell*(RO+1)); ctx.clip();
  for(let r=0;r<RO;r++)for(let c=0;c<CO;c++){ const gm=grid[r]&&grid[r][c]; if(!gm)continue;
    const col=colors[gm.cn]; if(!col)continue;
    drawShape(gm.px,gm.py,cell*0.36,col.shape,col.hex,col.dk); }
  ctx.restore();

  // monsters
  for(const m of mons){
    const x=monX(m),r=monR(m);
    ctx.save(); ctx.translate(x,m.y);
    const wob=Math.sin(m.ph*2)*0.05; ctx.scale(1+wob,1-wob);
    ctx.fillStyle=m.boss?'#a99175':'#cfc3ad';
    ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.fill();
    ctx.fillStyle=m.boss?'#8a7358':'#b3a68c';
    ctx.beginPath(); ctx.arc(0,r*0.35,r*0.6,0,7); ctx.fill();
    ctx.fillStyle='#1a1420'; const e=r*0.28;
    ctx.beginPath(); ctx.arc(-e,-e*0.6,e*0.42,0,7); ctx.arc(e,-e*0.6,e*0.42,0,7); ctx.fill();
    if(m.poison){ ctx.fillStyle='rgba(92,232,164,0.35)'; ctx.beginPath(); ctx.arc(0,0,r+3,0,7); ctx.fill(); }
    if(m.slow>0){ ctx.strokeStyle='rgba(88,199,255,0.6)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(0,0,r+4,0,7); ctx.stroke(); }
    if(m.hp<m.maxhp){ ctx.strokeStyle='#ff4d6d'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(0,0,r+6,-Math.PI/2,-Math.PI/2+6.283*Math.max(0,m.hp/m.maxhp)); ctx.stroke(); }
    ctx.restore();
  }

  // projectiles
  for(const p of projs){ if(p.delay>0)continue; const col=colors[p.cn]; if(!col)continue;
    ctx.fillStyle=col.hex;
    ctx.beginPath(); ctx.arc(p.x,p.y,5,0,7); ctx.fill();
    ctx.globalAlpha=0.35; ctx.fillRect(p.x-2,p.y,4,26); ctx.globalAlpha=1; }

  // zaps
  for(const z of zaps){ ctx.strokeStyle='rgba(255,210,63,'+(z.life/0.18)+')'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(z.x1,z.y1);
    const mx=(z.x1+z.x2)/2+rnd(-8,8), my=(z.y1+z.y2)/2+rnd(-8,8);
    ctx.lineTo(mx,my); ctx.lineTo(z.x2,z.y2); ctx.stroke(); }

  // particles
  for(const p of parts){ const a=p.life/p.max; ctx.globalAlpha=a; ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*a+0.5,0,7); ctx.fill(); ctx.globalAlpha=1; }

  // floats
  ctx.textAlign='center';
  for(const f of floats){ ctx.globalAlpha=Math.min(1,f.life*1.6); ctx.fillStyle=f.col;
    ctx.font='700 '+f.size+'px "Arial Narrow","Avenir Next Condensed",sans-serif';
    ctx.fillText(f.txt,f.x,f.y); ctx.globalAlpha=1; }

  // HUD
  if(state!=='title'){
    ctx.textAlign='left';
    for(let i=0;i<3;i++){ ctx.fillStyle=i<hearts?'#ff4d6d':'rgba(239,230,216,0.15)';
      ctx.font='18px sans-serif'; ctx.fillText('♥',10+i*22,26); }
    ctx.fillStyle='#efe6d8'; ctx.textAlign='center';
    ctx.font='700 18px "Arial Narrow","Avenir Next Condensed",sans-serif';
    ctx.fillText(String(score),W/2,26);
    ctx.fillStyle='rgba(239,230,216,0.45)'; ctx.font='11px "Arial Narrow",sans-serif';
    ctx.fillText('W A V E  '+wave,W/2,42);
    // xp bar
    ctx.fillStyle='rgba(239,230,216,0.12)'; ctx.fillRect(W*0.2,50,W*0.6,4);
    ctx.fillStyle='#ff7a3c'; ctx.fillRect(W*0.2,50,W*0.6*Math.min(1,xp/xpNeed),4);
    // build readout
    ctx.textAlign='right'; ctx.font='11px "Arial Narrow",sans-serif';
    let ty=24;
    for(const c of activeList()){ ctx.fillStyle=colors[c].hex;
      ctx.fillText(colors[c].name+' '+['','I','II','III'][lvl[c]||1],W-10,ty); ty+=14; }
  }

  if(hurtFlash>0){ ctx.fillStyle='rgba(255,77,109,'+hurtFlash*0.28+')';
    ctx.fillRect(-20,-20,W+40,H+40); }
}

// ---------- loop ----------
let last=performance.now();
function frame(now){
  const raw=Math.min(0.033,(now-last)/1000); last=now;
  tReal+=raw; hurtFlash=Math.max(0,hurtFlash-raw*2.2);
  if(state==='play'&&!paused) update(raw);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
